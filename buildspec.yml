version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Checking environment..."
      - aws --version

  pre_build:
    commands:
      - echo "Installing backend dependencies for validation..."
      - cd Backend && npm install
      - cd ..

  build:
    commands:
      - echo "Build phase - preparing frontend..."
      # If you have a build step for frontend, add it here (e.g., npm run build)

  post_build:
    commands:
      - echo "Deploying Frontend to S3..."
      # Sync the Frontend folder to your S3 bucket
      - aws s3 sync Frontend/ s3://prajwalgowda.online --delete
      
      - echo "Deploying Backend to EC2 via SSM..."
      # Trigger the deployment script on instances tagged Role=Backend
      - |
        aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --targets "Key=tag:Role,Values=Backend" \
          --comment "Deploying latest backend via CodeBuild" \
          --parameters 'commands=["sudo -u ubuntu -i bash /home/ubuntu/aws-new-repo/scripts/application_start.sh"]' \
          --region ${AWS_REGION:-ap-south-1}
      
      - echo "Deployment initiated successfully!"

artifacts:
  files:
    - '**/*'
